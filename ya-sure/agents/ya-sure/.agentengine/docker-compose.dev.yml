# Auto-generated by agentic-cli — do not edit directly
# Regenerate with: agentengine dev up
#
# Explicit project name so `agentengine dev up` and `agentengine dev clean` target the same stack.
# (Without this, Compose defaults to the .agentengine directory name, i.e. "agentengine".)

name: ya-sure

services:
  app:
    # Revive crashed containers; docker compose stop/clean still wins.
    restart: "on-failure:5"
    build:
      context: ..
      dockerfile: .agentengine/Dockerfile.dev
      args:

        RUNNER_BASE_REPOSITORY: "${RUNNER_BASE_REPOSITORY:-ghcr.io/mongodb/agent-engine-client-libraries/runner-base}"
        RUNNER_BASE_TAG: "${RUNNER_BASE_TAG:-0.1.125}"

    working_dir: /app
    volumes:
      - ..:/app

      - uv-cache:/root/.cache/uv

      - C:/Users/HTTP/.agentengine/mcp-oauth/6a5f59a39c5dca374bc072cf93f366fea2d0ef43d4350b943ee8afb0c73792be:/root/.agentic/mcp-oauth
    environment:

      MONGODB_URI: "mongodb://mongodb:27017/?directConnection=true"

      OE_URL: "http://oe:8000"
      ORG_ID: "${ORG_ID:-000000000000000000000001}"
      APP_ID: "484e300ea09312d396cacc0a"
      PROJECT_ID: "5ea2d21a536eb743cb03b00d"
      UV_EXCLUDE_NEWER: "7 days"

      AGENTIC_SENTRY_ENABLED: "${AGENTIC_SENTRY_ENABLED:-}"
      AGENTIC_SENTRY_DSN: "${AGENTIC_SENTRY_DSN:-}"
      AGENTIC_SENTRY_ENVIRONMENT: "${AGENTIC_SENTRY_ENVIRONMENT:-local-dev-hot-reload}"
      AGENTIC_SENTRY_RELEASE: "${AGENTIC_SENTRY_RELEASE:-}"

      APP_HOST: "0.0.0.0"
      AGENTIC_DEV_MODES: "aer,tool"
      AGENTIC_DEV_WATCH: "${AGENTIC_DEV_WATCH:-1}"
      # Inside the container, not the bind-mounted agent folder: the container
      # runs as root, so files it writes there are root-owned on a Linux host
      # and dev clean cannot remove them. The Logs page reads them from here.
      LOG_DIR: "/tmp/agentengine-logs"

      AGENTIC_EGRESS_PROXY_AER: "${AGENTIC_EGRESS_PROXY_AER}"
      AGENTIC_EGRESS_PROXY_TOOL: "${AGENTIC_EGRESS_PROXY_TOOL}"
      AGENTIC_EGRESS_NO_PROXY: "${AGENTIC_EGRESS_NO_PROXY}"


    networks:
      default:
        aliases:
          - 484e300ea09312d396cacc0a-aer
          - 484e300ea09312d396cacc0a-tool
    depends_on:

      mongodb:
        condition: service_healthy

      oe:
        condition: service_healthy
    healthcheck:

      test: ["CMD-SHELL", "python -c \"import urllib.request; [urllib.request.urlopen(f'http://localhost:{p}/health') for p in (8001,8002)]\""]

      interval: 5s
      timeout: 3s
      # Expire before the CLI's localReadinessTimeout (8m) so a broken app
      # reports unhealthy rather than the generic readiness timeout. The app
      # installs its dependencies and builds before either port answers.
      retries: 36
      start_period: 60s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  oe:
    restart: "on-failure:5"
    image: "${ORCHESTRATOR_IMAGE:-ghcr.io/mongodb/agent-engine-client-libraries/orchestration-engine:0.11.14}"
    env_file:
      - ../.env
    environment:
      AER_URL: "http://app:8001"
      TOOL_URL: "http://app:8002"
      OE_URL: "http://oe:8000"
      OE_HTTP_PORT: "8000"
      OE_GRPC_PORT: "50051"
      ORG_ID: "${ORG_ID:-000000000000000000000001}"
      PROJECT_ID: "5ea2d21a536eb743cb03b00d"

      AGENTIC_SENTRY_ENABLED: "${AGENTIC_SENTRY_ENABLED:-}"
      AGENTIC_SENTRY_DSN: "${AGENTIC_SENTRY_DSN:-}"
      AGENTIC_SENTRY_ENVIRONMENT: "${AGENTIC_SENTRY_ENVIRONMENT:-local-dev-hot-reload}"
      AGENTIC_SENTRY_RELEASE: "${AGENTIC_SENTRY_RELEASE:-}"


      MONGODB_URI: mongodb://mongodb:27017


      MDB_AGENTIC_STORE_DB: ""
      OE_SANDBOXES_CONFIG_PATH: "/etc/agentic/oe-sandboxes/sandboxes.json"
    volumes:
      - ./oe-sandboxes:/etc/agentic/oe-sandboxes:ro
    ports:

      - target: 8000
        published: 64383
        host_ip: 127.0.0.1


      - target: 50051
        published: 64384
        host_ip: 127.0.0.1


    depends_on:
      mongodb:
        condition: service_healthy


    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8000/health || wget -q -O /dev/null http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s


  mongodb:
    restart: "on-failure:5"
    image: "mongodb/mongodb-atlas-local:8.3.3"
    hostname: mongodb
    ports:

      - target: 27017
        published: 64385
        host_ip: 127.0.0.1

    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    # Each check opens about 8 connections that mongod logs (~30 lines), so
    # steady-state checks are sparse and the log is size-capped. start_interval
    # detects the ~8s atlas-local boot within ~1s; providers that ignore it
    # (podman-compose before 1.6, Docker Engine before 25) probe at interval, so
    # interval stays short enough not to delay readiness much. retries keeps the
    # unhealthy horizon (start_period + retries*interval) at about 2m when probes
    # fail fast, or up to about 3m when each probe runs to its timeout.
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/runner healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 60s
      start_interval: 1s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"




  ui:
    restart: "on-failure:5"

    image: "${PLAYGROUND_UI_IMAGE:-ghcr.io/mongodb/agent-engine-client-libraries/playground-ui:0.1.125}"
    container_name: ya-sure-ui
    environment:
      OE_PROXY_TARGET: "http://oe:8000"
      AER_URL: "http://app:8001"
      TOOL_URL: "http://app:8002"
      AGENTIC_SENTRY_ENABLED: "${AGENTIC_SENTRY_ENABLED:-}"
      AGENTIC_SENTRY_DSN: "${AGENTIC_SENTRY_DSN:-}"
      AGENTIC_SENTRY_ENVIRONMENT: "${AGENTIC_SENTRY_ENVIRONMENT:-local-dev-hot-reload}"
      AGENTIC_SENTRY_RELEASE: "${AGENTIC_SENTRY_RELEASE:-}"
      ORG_ID: "${ORG_ID:-000000000000000000000001}"
      APP_ID: "484e300ea09312d396cacc0a"
      PROJECT_ID: "5ea2d21a536eb743cb03b00d"
      AGENTIC_MEMORY_ENABLED: "false"
      AGENTIC_EGRESS_STATE: "${AGENTIC_EGRESS_STATE:-off}"
      AGENTIC_EGRESS_REASON: "${AGENTIC_EGRESS_REASON:-}"
      AGENTIC_EGRESS_SUMMARY: "${AGENTIC_EGRESS_SUMMARY:-}"
      AGENTIC_EGRESS_AER_MODE: "${AGENTIC_EGRESS_AER_MODE:-}"
      AGENTIC_EGRESS_TOOL_MODE: "${AGENTIC_EGRESS_TOOL_MODE:-}"

    ports:

      - target: 3000
        published: 3000
        host_ip: 127.0.0.1



volumes:

  uv-cache:

  mongo-data:
  mongo-config:

